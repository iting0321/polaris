################################################################################
# Polaris Server Configuration File
#
# This file should be placed in $PWD/config/application.properties relative to
# where the Polaris server is started.
#
# For the binary distribution, this means:
#   - server/config/application.properties  (for the server component)
#
# All properties below are commented out and show their default values.
# Uncomment and modify as needed.
#
# For more information, see the Polaris configuration documentation.
################################################################################

#------------------------------------------------------------------------------
# Persistence Configuration
#------------------------------------------------------------------------------
# Define the persistence backend used by Polaris (in-memory, relational-jdbc)
#polaris.persistence.type=relational-jdbc

# Total number of retries JDBC persistence will attempt on connection resets or serialization failures
#polaris.persistence.relational.jdbc.max-retries=1

# Max time interval (ms) since the start of a transaction when retries can be attempted
#polaris.persistence.relational.jdbc.max_duaration_in_ms=5000

# Initial delay before retrying. The delay is doubled after each retry
#polaris.persistence.relational.jdbc.initial_delay_in_ms=100

#------------------------------------------------------------------------------
# Realm Configuration
#------------------------------------------------------------------------------
# Define the type of the Polaris realm to use
#polaris.realm-context.type=default

# Define the list of realms to use
#polaris.realm-context.realms=POLARIS

# Define the header name defining the realm context
#polaris.realm-context.header-name=Polaris-Realm

#------------------------------------------------------------------------------
# Feature Flags
#------------------------------------------------------------------------------
# Require that principals must rotate their credentials before being used
#polaris.features."ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING"=false

# Skip credential-subscoping indirection entirely when obtaining storage credentials
#polaris.features."SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION"=false

# Permit S3 storage configurations to have custom endpoints
#polaris.features."ALLOW_SETTING_S3_ENDPOINTS"=true

# Allow one table's location to reside within another table's location
#polaris.features."ALLOW_TABLE_LOCATION_OVERLAP"=false

# Allow one namespace's location to reside within another namespace's location
#polaris.features."ALLOW_NAMESPACE_LOCATION_OVERLAP"=false

# Allow metadata files to be located outside the default metadata directory
#polaris.features."ALLOW_EXTERNAL_METADATA_FILE_LOCATION"=false

# Allow catalog URLs to overlap
#polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"=false

# Allow unstructured table locations
#polaris.features."ALLOW_UNSTRUCTURED_TABLE_LOCATION"=false

# Allow tables to have external locations outside the default structure
#polaris.features."ALLOW_EXTERNAL_TABLE_LOCATION"=false

# Allow credential vending for external catalogs
#polaris.features."ALLOW_EXTERNAL_CATALOG_CREDENTIAL_VENDING"=true

# Process asterisks in allowed storage locations as meaning 'any location'
#polaris.features."ALLOW_WILDCARD_LOCATION"=false

# The list of supported storage types for a catalog
#polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=S3,AZURE,GCS

# Clean up data when a namespace is dropped
#polaris.features."CLEANUP_ON_NAMESPACE_DROP"=false

# Clean up data when a catalog is dropped
#polaris.features."CLEANUP_ON_CATALOG_DROP"=false

# Allow tables to be dropped with the purge parameter set to true
#polaris.features."DROP_WITH_PURGE_ENABLED"=false

# Attempt to delete view metadata files when a view is dropped
#polaris.features."PURGE_VIEW_METADATA_ON_DROP"=true

# Polaris task expiry timeout (milliseconds)
#polaris.features."POLARIS_TASK_TIMEOUT_MILLIS"=300000

# Duration of time that vended storage credentials are valid for (seconds)
#polaris.features."STORAGE_CREDENTIAL_DURATION_SECONDS"=3600

# How long to store storage credentials in the local cache (seconds)
#polaris.features."STORAGE_CREDENTIAL_CACHE_DURATION_SECONDS"=1800

# How many times to retry refreshing metadata when the previous error was retryable
#polaris.features."MAX_METADATA_REFRESH_RETRIES"=2

# Enable pagination for APIs like listTables
#polaris.features."LIST_PAGINATION_ENABLED"=false

# Enable the generic-tables endpoints
#polaris.features."ENABLE_GENERIC_TABLES"=true

# Maximum weight for the entity cache
#polaris.features."ENTITY_CACHE_WEIGHER_TARGET"=104857600

# Allow creating and using ExternalCatalogs for federation
#polaris.features."ENABLE_CATALOG_FEDERATION"=false

# Allow RBAC operations for federated catalogs
#polaris.features."ENABLE_SUB_CATALOG_RBAC_FOR_FEDERATED_CATALOGS"=false

# Enable the policy-store endpoints
#polaris.features."ENABLE_POLICY_STORE"=true

# The list of supported catalog connection types for federation
#polaris.features."SUPPORTED_CATALOG_CONNECTION_TYPES"=ICEBERG_REST

# The list of supported authentication types for catalog federation
#polaris.features."SUPPORTED_EXTERNAL_CATALOG_AUTHENTICATION_TYPES"=OAUTH,BEARER,SIGV4

# Max number of times to try committing to an Iceberg table
#polaris.features."ICEBERG_COMMIT_MAX_RETRIES"=4

# Allow setting the FILE_IO_IMPL using catalog properties (dev/test only)
#polaris.features."ALLOW_SPECIFYING_FILE_IO_IMPL"=false

# Allow usage of FileIO implementations that are considered insecure (test only)
#polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=false

# Rollback replace snapshots created by compaction on conflicts
#polaris.features."ICEBERG_ROLLBACK_COMPACTION_ON_CONFLICTS"=false

# Add trailing slash to base location for tables or namespaces
#polaris.features."ADD_TRAILING_SLASH_TO_LOCATION"=true

# Allow enabling OPTIMIZED_SIBLING_CHECK feature for catalogs
#polaris.features."ALLOW_OPTIMIZED_SIBLING_CHECK"=false

# Use index for sibling check between tables, views, and namespaces
#polaris.features."OPTIMIZED_SIBLING_CHECK"=false

# Apply prefix to Iceberg table/view locations within catalog base location
#polaris.features."DEFAULT_LOCATION_OBJECT_STORAGE_PREFIX_ENABLED"=false

# Enable or disable the API to reset principal credentials
#polaris.features."ENABLE_CREDENTIAL_RESET"=true

# Allow setting catalog property for sub-catalog RBAC
#polaris.features."ALLOW_SETTING_SUB_CATALOG_RBAC_FOR_FEDERATED_CATALOGS"=true

# Allow dropping non-empty passthrough-facade catalog
#polaris.features."ALLOW_DROPPING_NON_EMPTY_PASSTHROUGH_FACADE_CATALOG"=false

# Enable finer grained update table privileges
#polaris.features."ENABLE_FINE_GRAINED_UPDATE_TABLE_PRIVILEGES"=true

# Allow credential vending for federated catalogs
#polaris.features."ALLOW_FEDERATED_CATALOGS_CREDENTIAL_VENDING"=true

# Timeout in milliseconds for Azure API requests
#polaris.features."AZURE_TIMEOUT_MILLIS"=15000

# Number of retry attempts for Azure API requests
#polaris.features."AZURE_RETRY_COUNT"=3

# Initial delay in milliseconds before first retry for Azure API requests
#polaris.features."AZURE_RETRY_DELAY_MILLIS"=2000

# Jitter factor applied to retry delays for Azure API requests
#polaris.features."AZURE_RETRY_JITTER_FACTOR"=0.5

# Metadata batch size for tasks that clean up dropped tables' files
#polaris.features."TABLE_METADATA_CLEANUP_BATCH_SIZE"=10

# Validate that view locations don't overlap when views are created
#polaris.features."VALIDATE_VIEW_LOCATION_OVERLAP"=true

# Maximum locations associated with a storage configuration (-1 for unlimited)
#polaris.features."STORAGE_CONFIGURATION_MAX_LOCATIONS"=-1

# Use soft values in the entity cache
#polaris.features."ENTITY_CACHE_SOFT_VALUES"=false

# Mark metadata as current on commit to skip re-reading
#polaris.features."TABLE_OPERATIONS_MAKE_METADATA_CURRENT_ON_COMMIT"=true

# Allow namespaces with completely arbitrary locations
#polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"=false

# Fall back on schema version 0 when VERSION table does not exist
#polaris.features."SCHEMA_VERSION_FALL_BACK_ON_DNE"=true

#------------------------------------------------------------------------------
# Authentication Configuration
#------------------------------------------------------------------------------
# Type of authentication (internal, external, mixed)
#polaris.authentication.type=internal

# Polaris authenticator type
#polaris.authentication.authenticator.type=default

# Polaris token service type
#polaris.authentication.token-service.type=default

# Polaris token broker type
#polaris.authentication.token-broker.type=rsa-key-pair

# Max token generation policy on the token broker
#polaris.authentication.token-broker.max-token-generation=PT1H

# Location of the RSA-256 private key file
#polaris.authentication.token-broker.rsa-key-pair.private-key-file=

# Location of the RSA-256 public key file
#polaris.authentication.token-broker.rsa-key-pair.public-key-file=

# Secret of the symmetric key
#polaris.authentication.token-broker.symmetric-key.secret=secret

# Location of the symmetric key file
#polaris.authentication.token-broker.symmetric-key.file=/tmp/symmetric.key

#------------------------------------------------------------------------------
# OIDC Configuration
#------------------------------------------------------------------------------
# PrincipalMapper implementation type
#polaris.oidc.principal-mapper.type=default

# Path to the claim containing the principal ID
#polaris.oidc.principal-mapper.id-claim-path=

# Path to the claim containing the principal name
#polaris.oidc.principal-mapper.name-claim-path=

# PrincipalRolesMapper implementation type
#polaris.oidc.principal-roles-mapper.type=default

# Regex to filter roles from the OIDC token
#polaris.oidc.principal-roles-mapper.filter=

#------------------------------------------------------------------------------
# Storage Configuration
#------------------------------------------------------------------------------
# AWS S3 access key (if unset, default credential provider chain is used)
#polaris.storage.aws.access-key=

# AWS S3 secret key (if unset, default credential provider chain is used)
#polaris.storage.aws.secret-key=

# Google Cloud Storage token
#polaris.storage.gcp.token=

# Google Cloud Storage lifespan type
#polaris.storage.gcp.lifespan=PT1H

#------------------------------------------------------------------------------
# Logging Configuration
#------------------------------------------------------------------------------
# Header name to match request ID in the log
#polaris.log.request-id-header-name=X-Request-ID

# Log context (MDC) AID
#polaris.log.mdc.aid=polaris

# Log context (MDC) SID
#polaris.log.mdc.sid=polaris-service

#------------------------------------------------------------------------------
# Rate Limiter Configuration
#------------------------------------------------------------------------------
# Polaris rate limiter type (no-op, token-bucket)
#polaris.rate-limiter.filter.type=no-op

# Token bucket rate limiter type
#polaris.rate-limiter.token-bucket.type=default

# Requests per second for token bucket rate limiter
#polaris.rate-limiter.token-bucket.requests-per-second=9999

#------------------------------------------------------------------------------
# Metrics Configuration
#------------------------------------------------------------------------------
# Arbitrary metric tags (application=Polaris is the default)
#polaris.metrics.tags.application=Polaris

# Enable realm_id tag in API metrics
#polaris.metrics.realm-id-tag.api-metrics-enabled=false

# Enable realm_id tag in HTTP request metrics
#polaris.metrics.realm-id-tag.http-metrics-enabled=false

# Maximum cardinality for realm_id tag in HTTP request metrics
#polaris.metrics.realm-id-tag.http-metrics-max-cardinality=100

#------------------------------------------------------------------------------
# Task Configuration
#------------------------------------------------------------------------------
# Max number of concurrent tasks
#polaris.tasks.max-concurrent-tasks=100

# Max number of tasks in queue
#polaris.tasks.max-queued-tasks=1000

#------------------------------------------------------------------------------
# Event Listener Configuration
#------------------------------------------------------------------------------
# Polaris event listener type (no-op, aws-cloudwatch)
#polaris.event-listener.type=no-op

# AWS CloudWatch log group name
#polaris.event-listener.aws-cloudwatch.log-group=polaris-cloudwatch-default-group

# AWS CloudWatch log stream name
#polaris.event-listener.aws-cloudwatch.log-stream=polaris-cloudwatch-default-stream

# AWS region for CloudWatch event listener
#polaris.event-listener.aws-cloudwatch.region=us-east-1

# Send log events to CloudWatch synchronously
#polaris.event-listener.aws-cloudwatch.synchronous-mode=false

# Duration to buffer events in memory before flushing
#polaris.event-listener.persistence-in-memory-buffer.buffer-time=5000ms

# Maximum events in buffer before triggering flush
#polaris.event-listener.persistence-in-memory-buffer.max-buffer-size=5

#------------------------------------------------------------------------------
# Credential Manager Configuration
#------------------------------------------------------------------------------
# Credential manager type
#polaris.credential-manager.type=default

#------------------------------------------------------------------------------
# Compaction Configuration
#------------------------------------------------------------------------------
# Rollback compaction snapshots on conflicts
#polaris.config.rollback.compaction.on-conflicts.enabled=false

#------------------------------------------------------------------------------
# Quarkus HTTP Configuration
#------------------------------------------------------------------------------
# Root log level
#quarkus.log.level=INFO

# Log level for org.apache.polaris category
#quarkus.log.category."org.apache.polaris".level=INFO

# Force use of a specific locale
#quarkus.default-locale=en_US

# HTTP port number
#quarkus.http.port=8181

# Enable HTTP basic authentication
#quarkus.http.auth.basic=false

# HTTP max body size limit
#quarkus.http.limits.max-body-size=10240K

# HTTP CORS origins
#quarkus.http.cors.origins=

# HTTP CORS methods
#quarkus.http.cors.methods=PATCH,POST,DELETE,GET,PUT

# HTTP CORS headers
#quarkus.http.cors.headers=*

# HTTP CORS exposed headers
#quarkus.http.cors.exposed-headers=*

# HTTP CORS access control max age
#quarkus.http.cors.access-control-max-age=PT10M

# HTTP CORS access control allow credentials
#quarkus.http.cors.access-control-allow-credentials=true

#------------------------------------------------------------------------------
# Quarkus Management Configuration
#------------------------------------------------------------------------------
# Enable the management server
#quarkus.management.enabled=true

# Management server port number
#quarkus.management.port=8182

# Management server root path
#quarkus.management.root-path=

#------------------------------------------------------------------------------
# OpenTelemetry Configuration
#------------------------------------------------------------------------------
# Disable OpenTelemetry SDK
#quarkus.otel.sdk.disabled=true
